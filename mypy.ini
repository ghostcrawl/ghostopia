[mypy]
# Strict-ish type checking for the hand-written backend surface. src/ layout means
# each package's importable root lives under packages/<name>/src (+ apps/server/src);
# explicit_package_bases + mypy_path lets `mypy packages apps/server` resolve every
# file to its ghostopia_<name> module with no path-collision.
python_version = 3.12
namespace_packages = True
explicit_package_bases = True
mypy_path =
    packages/shared/src,
    packages/event-bus/src,
    packages/ghost-world/src,
    packages/ghost-runtime/src,
    packages/agent-runtime/src,
    packages/browser-provider/src,
    packages/ghostcrawl-provider/src,
    packages/behaviors/src,
    packages/behavior-executor/src,
    packages/sections/src,
    packages/orchestration/src,
    packages/core/src,
    apps/server/src

warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
no_implicit_optional = True
check_untyped_defs = True

# The ghostcrawl SDK is Kiota-generated in parts; don't require stubs for it or
# other third-party deps.
ignore_missing_imports = True

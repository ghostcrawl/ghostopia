[project]
name = "ghostopia-shared"
version = "0.0.0"
description = "ghostopia shared package."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostopia_shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

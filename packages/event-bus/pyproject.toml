[project]
name = "ghostopia-event-bus"
version = "0.0.0"
description = "ghostopia event-bus package."
requires-python = ">=3.12"
# The event bus validates every published envelope against the shared Envelope model,
# so it depends on ghostopia-shared (resolved as a workspace path source below).
dependencies = ["ghostopia-shared", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostopia_event_bus"]

[tool.uv.sources]
ghostopia-shared = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

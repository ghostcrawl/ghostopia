[project]
name = "ghostopia-ghost-runtime"
version = "0.0.0"
description = "ghostopia ghost-runtime package (module ghostopia_ghost_runtime): coarse lifecycle state machine, concrete GhostHandle, and the GhostDriver (events -> server-authoritative presentation)."
requires-python = ">=3.12"
# The runtime reduces over the shared GhostState/GhostEvent contract and drives
# movement through the ghost-world A* + WorldMap. It depends on ghostopia-shared
# (contract types) and ghostopia-ghost-world (find_path + WorldMap), both resolved
# as workspace path sources below.
dependencies = ["ghostopia-shared", "ghostopia-ghost-world", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostopia_ghost_runtime"]

[tool.uv.sources]
ghostopia-shared = { workspace = true }
ghostopia-ghost-world = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project]
name = "ghostopia-agent-runtime"
version = "0.0.0"
description = "ghostopia agent-runtime package: the provider-agnostic AgentProvider seam + the v0 DeterministicRunner scripted task-runner. The LLM provider + AgentBehavior adapter slot in behind the same seam."
requires-python = ">=3.12"
# Emits shared Envelopes and drives the BrowserProvider Protocol — depends on
# ghostopia-shared + ghostopia-browser-provider (both workspace paths). No ghostcrawl SDK.
dependencies = ["ghostopia-shared", "ghostopia-browser-provider", "httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostopia_agent_runtime"]

[tool.uv.sources]
ghostopia-shared = { workspace = true }
ghostopia-browser-provider = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

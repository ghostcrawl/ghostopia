[project]
name = "ghostopia-orchestration"
version = "0.0.0"
description = "ghostopia orchestration — mission splitter + bounded backoff-aware WorkQueue (the execution engine)."
requires-python = ">=3.12"
dependencies = [
  "ghostopia-shared",
  "ghostopia-sections",
  "ghostopia-ghostcrawl-provider",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostopia_orchestration"]

[tool.uv.sources]
ghostopia-shared = { workspace = true }
ghostopia-sections = { workspace = true }
ghostopia-ghostcrawl-provider = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
